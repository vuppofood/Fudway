kind = "mobile"
previewPath = "/mobile/"
title = "Delivery Mobile"
description = "Um app mobile de delivery inspirado na tela enviada, com busca, categorias, restaurantes em destaque e navegação para início, pedidos e perfil."
version = "1.0.0"
id = "artifacts/delivery-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20618

[services.development]
run = "pnpm --filter @workspace/delivery-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/delivery-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/delivery-mobile", "run", "serve" ]

[services.env]
PORT = "20618"
BASE_PATH = "/mobile/"
